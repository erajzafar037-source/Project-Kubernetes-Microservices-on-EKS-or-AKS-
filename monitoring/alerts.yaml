apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: red-alerts, namespace: monitoring, labels: { release: kube-prometheus-stack } }
spec:
  groups:
    - name: red
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "5xx rate above 5% for {{ $labels.job }}" }
        - alert: HighLatencyP95
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 1
          for: 10m
          labels: { severity: warning }
