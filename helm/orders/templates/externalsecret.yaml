{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: {{ .Chart.Name }}-db }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: ClusterSecretStore }
  target: { name: {{ .Chart.Name }}-db }
  dataFrom: [{ extract: { key: {{ .Values.externalSecret.key }} } }]
{{- end }}
