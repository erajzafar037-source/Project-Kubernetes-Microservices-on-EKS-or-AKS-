apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Chart.Name }}, labels: { app: {{ .Chart.Name }} } }
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: {{ .Chart.Name }} } }
  template:
    metadata: { labels: { app: {{ .Chart.Name }} } }
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: {{ .Values.service.targetPort }} }]
          envFrom:
            - configMapRef: { name: {{ .Chart.Name }}-config }
            - secretRef: { name: {{ .Chart.Name }}-db }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
